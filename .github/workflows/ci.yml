name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  WEB_IMAGE_NAME: ${{ github.repository }}
  PUBLISH_IMAGE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  test-unit:
    name: Node unit tests + manifest validation
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate kit manifest
        run: node -e 'JSON.parse(require("fs").readFileSync("assets/kits/manifest.json","utf8")); console.log("manifest.json OK")'

      - name: Run Node unit tests
        run: node --test 'scenarios/**/*.test.mjs' 'src/data/**/*.test.mjs'

      - name: Static syntax check on browser modules
        run: |
          for f in src/engine/engine.js src/engine/props.js src/game/loop.js \
                   src/ai/director.js src/ai/provider.js src/ai/mockProvider.js \
                   src/data/eventlog.js src/data/learnerModel.js src/data/analytics.js \
                   src/speech/speech.js src/ui/hud.js \
                   scenarios/scenarios.js; do
            node --check "$f"
          done

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            **/test-results
            **/*.log
          if-no-files-found: ignore
          retention-days: 7

  test-desktop-e2e:
    name: Desktop e2e (Playwright + Chrome)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production desktop image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: lifespeak-web:desktop-e2e
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Run desktop e2e against containerized game
        env:
          GAME_IMAGE_TAG: lifespeak-web:desktop-e2e
          GAME_PORT: 8080
        run: |
          set -euo pipefail
          docker run -d --rm --name lifespeak-e2e \
            -p 127.0.0.1:${GAME_PORT}:8080 \
            "${GAME_IMAGE_TAG}"
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${GAME_PORT}/" >/dev/null; then
              echo "Container ready on attempt $i"
              break
            fi
            sleep 2
          done
          curl -fsS "http://127.0.0.1:${GAME_PORT}/" >/dev/null
          npx playwright test --project=desktop --workers=1
          docker stop lifespeak-e2e >/dev/null || true

      - name: Upload desktop e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-desktop-attempt-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  test-mobile-e2e:
    name: Mobile e2e (Playwright + redroid)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image for mobile e2e
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: lifespeak-web:mobile-e2e
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Start redroid Android container
        run: ./scripts/ci-start-redroid.sh

      - name: Run game container (loopback-bound)
        run: |
          docker run -d --rm --name lifespeak-mobile \
            --add-host host.docker.internal:host-gateway \
            -p 127.0.0.1:8080:8080 \
            lifespeak-web:mobile-e2e
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8080/" >/dev/null; then
              echo "Game ready on attempt $i"
              break
            fi
            sleep 2
          done
          curl -fsS "http://127.0.0.1:8080/" >/dev/null

      - name: Open game URL in redroid browser
        env:
          REDROID_SERIAL: 127.0.0.1:5555
        run: |
          adb -s "$REDROID_SERIAL" shell am start -a android.intent.action.VIEW -d "http://127.0.0.1:8080/" \
            "${REDROID_BROWSER_PACKAGE:-org.chromium.chrome}"

      - name: Run mobile-project Playwright spec
        env:
          REDROID_BROWSER_PACKAGE: ${{ env.REDROID_BROWSER_PACKAGE }}
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test --project=mobile --workers=1

      - name: Stop game container
        if: always()
        run: docker stop lifespeak-mobile >/dev/null 2>&1 || true

      - name: Upload mobile e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-mobile-redroid-attempt-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  quality-gate:
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs:
      - test-unit
      - test-desktop-e2e
      - test-mobile-e2e
    steps:
      - name: Require every test job
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<<"$REQUIRED_RESULTS" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e 'all(.[]; .result == "success")' <<<"$REQUIRED_RESULTS"

  build-and-publish:
    needs: quality-gate
    timeout-minutes: 90
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PUBLISH_IMAGE == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web