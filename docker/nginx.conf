server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/javascript image/svg+xml;

    # Required for three.js and other module scripts
    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js mjs;
        application/json                      json;
        image/svg+xml                         svg;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/gif                             gif;
        font/woff                             woff;
        font/woff2                            woff2;
        audio/mpeg                            mp3;
        audio/wav                             wav;
    }

    # SPA fallback for any client-side routes added later
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for static assets (manifest.json is revalidated each load)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # API calls (optional: if the same container later proxies to an AI provider)
    # location /api/ { proxy_pass http://api:8080; }
}
